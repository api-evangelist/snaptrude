name: Snaptrude
description: >-
  Snaptrude is a cloud-native design platform for architecture and interior design
  that unifies sketching, real-time collaboration, AI-assisted programming, and BIM
  into a single browser-based tool. Snaptrude 3.0 offers four integrated modes —
  Program, Design Canvas, Present, and BIM — that turn concept massing into
  Revit-ready assemblies while surfacing live metrics (GFA, FAR, cost, daylight).
  For developers, Snaptrude publishes a client-side Plugin API (the `snaptrude`
  namespace) documented at docs.snaptrude.com, with official @snaptrude npm
  packages and a create-snaptrude-plugin CLI to scaffold, register, and update
  React + TypeScript plugins. Backed by Accel.
