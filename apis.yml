apis:
- name: Snaptrude Plugin API
  description: >-
    Client-side JavaScript/TypeScript Plugin API (the `snaptrude` global namespace)
    for extending the Snaptrude platform. Organized by namespace — Core, Design,
    Entity, Program, Presentation, Analysis — plus a Structure Collection JSON data
    format. Consumed from a plugin Web Worker via @snaptrude/plugin-client.
